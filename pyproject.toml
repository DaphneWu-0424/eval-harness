[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trajectory-eval-harness"
version = "0.1.0"
description = "Trajectory-centric model and agent evaluation harness"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
  "sympy>=1.12,<2",
]

[project.scripts]
eval-harness = "eval_harness.cli:main"

[tool.setuptools.packages.find]
include = ["eval_harness*"]

[tool.ruff]
line-length = 100

