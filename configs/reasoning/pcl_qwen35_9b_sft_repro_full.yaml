experiment:
  name: pcl_qwen35_9b_sft_repro_full
  output_dir: /workspace/results/pcl_qwen35_9b_sft_repro_full
  seed: 20260910

task:
  type: reasoning

dataset:
  type: jsonl
  path: /workspace/datasets/PCL-Reasoner-V1.5-RL-Math/split/test.jsonl
  input_key: problem
  reference_key: ground_truth
  source_key: source

executor:
  type: model

prompt:
  type: math_boxed
  suffix: |
    Please reason step by step, and put your final answer within \boxed{}.

backend:
  type: openai_compatible
  model: qwen35-9b-sft-repro-20260916-215355
  endpoints:
    - http://127.0.0.1:31000/v1

generation:
  n: 1
  temperature: 1.0
  top_p: 0.95
  top_k: 20
  presence_penalty: 1.5
  max_tokens: 81920
  concurrency: 32
  timeout_sec: 7200
  retries: 5

evaluators:
  - type: math
    name: math_v1
    extractor:
      type: composite_math
    llm_fallback:
      enabled: true
      trigger_verdicts: [UNKNOWN, INCORRECT]
      concurrency: 16
      backend:
        type: openai_compatible
        model: deepseek-chat
        endpoint_env: DEEPSEEK_BASE_URL
        api_key_env: DEEPSEEK_API_KEY
      generation:
        temperature: 0.0
        max_tokens: 2048
        timeout_sec: 300
        retries: 5
        response_format:
          type: json_object

metrics:
  - type: accuracy
  - type: pass_at_k
    k: [1]
  - type: avg_at_k
  - type: length
  - type: truncation
  - type: per_source
