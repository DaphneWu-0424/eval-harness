experiment:
  name: alfworld_qwen15b_128
  output_dir: /work/results/alfworld_qwen15b_128
  seed: 0

task:
  type: agent

dataset:
  type: jsonl
  path: /work/alfworld_games_128.jsonl
  input_key: game_file

executor:
  type: agent

environment:
  type: alfworld
  alfworld_package_path: /env_package/alfworld
  config_path: /env_package/alfworld/configs/config_tw.yaml
  eval_dataset: eval_in_distribution
  data_root_env: ALFWORLD_DATA
  max_steps: 50

harness:
  type: alfworld
  history_length: 2

backend:
  type: openai_compatible
  model: Qwen2.5-1.5B-Instruct
  endpoints:
    - http://127.0.0.1:31000/v1

generation:
  n: 1
  temperature: 0.0
  top_p: 1.0
  max_tokens: 512
  concurrency: 16
  timeout_sec: 300
  retries: 3

evaluators:
  - type: agent_success
    name: agent_success_v1

metrics:
  - type: accuracy
