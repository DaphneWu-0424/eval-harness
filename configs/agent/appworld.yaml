experiment:
  name: appworld
  output_dir: /results/appworld
  seed: 0
task:
  type: agent
dataset:
  type: appworld_manifest
  path: /eval_harness/configs/manifests/appworld-test-normal.json
executor:
  type: agent
environment:
  type: appworld
  max_steps: 50
  timeout_seconds: 60
  seed: 0
harness:
  type: appworld
  history_length: 4
backend:
  type: openai_compatible
  model: current-checkpoint
